    <section class="intro">
      <p>膏方是中药传统剂型之一：药材反复煎煮、滤去渣滓、浓缩药液，再加蜂蜜或胶类收成稠厚的膏体。比起汤剂，它体积小、耐存放，服用也省事。</p>
      <p>二仙膏即属此类，成品为棕褐色稠厚的半流体，气香、味甜，以蜂蜜为辅料收膏。收膏是全程最考人的一步——火大则焦，火小则不成膏，全凭看膏体挂旗的厚薄来判断。</p>
